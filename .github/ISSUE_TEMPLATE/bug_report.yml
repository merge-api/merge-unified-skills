name: Bug report
description: Report a problem with a skill or the conversion script
labels: ["bug"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill or component
      description: Which skill or part of the repo is affected? (e.g. `merge-onboarding`, `scripts/convert.sh`)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What behavior were you expecting instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Run `/merge-unified:merge-onboarding`
        2. ...
        3. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Claude Code version, OS, SDK language and version, anything else relevant.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste any relevant error messages or transcript snippets. Redact API keys and account tokens.
    validations:
      required: false
