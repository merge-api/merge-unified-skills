name: Feature request
description: Suggest a new skill, an enhancement to an existing skill, or a new tool target for the conversion script
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user need or use case. Concrete examples help.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the skill or feature do? How would a developer invoke it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why this one is better.
    validations:
      required: false
  - type: input
    id: category
    attributes:
      label: Merge category (if applicable)
      description: HRIS, ATS, CRM, Accounting, Ticketing, File Storage, Knowledge Base, Marketing, or "any".
    validations:
      required: false
