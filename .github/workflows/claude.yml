name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]
    branches-ignore:
      - main

jobs:
  # Responds to @claude mentions in issues, PRs, and review comments.
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read

  # Skill-quality review: frontmatter, required sections, style rules, PR hygiene.
  # Triggered on every PR. Re-runnable by adding the `claude-review` label.
  claude-review-skill-quality:
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Skill Quality Review
        id: claude-review-skill-quality
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: false
          classify_inline_comments: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a PR to `merge-unified-skills` — a Claude Code plugin packaging skills for the Merge Unified API. Skills are markdown files (`SKILL.md`) with YAML frontmatter that describe when and how Claude should help developers integrate with Merge.

            Your job is to enforce the conventions in `CLAUDE.md` and `CONTRIBUTING.md` so skills stay consistent and high-quality.

            ## Step 1: Read the conventions

            Read these files first — they are the source of truth:
            - `CLAUDE.md` — short-form repo conventions (layout, style rules, don't-do list)
            - `CONTRIBUTING.md` — full contributor guide (skill writing principles, PR workflow, publish flow)
            - `.claude/skills/_template/SKILL.md` — the canonical skeleton (intentionally only in the `.claude/skills/` mirror, not in `skills/`)
            - `skills/merge-onboarding/SKILL.md` (or `.claude/skills/merge-onboarding/SKILL.md`) — the reference for a finished skill

            ## Step 2: Get the diff and read changed files

            Get the PR diff. For each changed `SKILL.md` or reference doc, read the FULL file. Also read:
            - `.claude-plugin/plugin.json` (to check version bump)
            - `CHANGELOG.md` (to check for an entry)
            - The other `SKILL.md` mirror if the repo still has both `skills/` and `.claude/skills/` directories

            ## Step 3: Review for skill quality

            Check each changed `SKILL.md` against these categories. The examples are illustrative, not exhaustive — flag any violation of the underlying principle.

            **1. Frontmatter completeness and quality**
            - `name:` matches the folder name (kebab-case)
            - `description:` lists SPECIFIC trigger phrases a developer might say — not a generic summary. Be liberal: more trigger phrases = better skill activation
            - `license: MIT`
            - `metadata.author: Merge` (NOT a personal name)
            - `metadata.version` set (start at `0.1.0`, bump on changes)

            **2. Required SKILL.md sections** (per `merge-onboarding/SKILL.md` as reference)
            - Top-level title (h1) and one-paragraph hook stating user goal + hero output
            - `## When to use this skill` with an explicit list of triggers AND a "Do NOT activate for" list
            - `## First activation: self-introduce` — a quote block where Claude announces the skill name and version on first activation (this confirms install worked and surfaces version)
            - Step-by-step body (numbered steps)
            - `## Troubleshooting` section with 3–8 entries in **SYMPTOM / CAUSE / FIX** format

            **3. Style rules** (from `CLAUDE.md`)
            - No personal names anywhere in user-facing files. Use "Merge".
            - Default to the **test environment** in every code example (`test_xxx` API keys, `https://api.merge.dev` test endpoints). Production should be called out explicitly as a separate step.
            - **Both SDK and HTTP examples** for any API call. Developers come from both worlds.
            - Embed **real values** — real endpoint paths (e.g., `POST https://api.merge.dev/api/integrations/create-link-token`), real schema field names, real response shapes. Never hand-wave with "see the docs".
            - Long supporting content (full schemas, deep API references, language-specific quickstarts) belongs in `references/*.md`, not inline in `SKILL.md`.

            **4. PR hygiene** (per `CONTRIBUTING.md`)
            - `.claude-plugin/plugin.json` `version` bumped on every PR
            - `CHANGELOG.md` has a new entry describing the change (under `[Unreleased]` or a new version)
            - **One skill per PR** — flag if multiple new skills are introduced in this PR
            - If the repo still has the dual layout (`skills/` and `.claude/skills/`), check that both copies of a skill match exactly. Drift between the two is a bug.

            **5. Skill writing principles** (from `CONTRIBUTING.md`)
            - First activation announces the skill name + version (confirms install worked)
            - Examples are real and runnable, not pseudocode
            - Troubleshooting entries cover the top 5–8 things that go wrong, not generic advice
            - References to other Merge skills (e.g., chaining to `merge-validate` after `merge-onboarding`) use the correct slash command form: `/merge-unified:<skill-name>`

            ## Step 4: Report findings

            For EACH specific issue, post an inline comment using `mcp__github_inline_comment__create_inline_comment`:

            **[Severity]** Brief title
            - Why: what's wrong and what the convention says
            - Fix: concrete change (with example if useful)
            - Reference: which file/section in `CLAUDE.md` or `CONTRIBUTING.md` this comes from

            Severity levels:
            - 🔴 **Must fix** — frontmatter missing required keys, validator would fail, multiple skills in one PR, missing version bump or CHANGELOG entry
            - 🟡 **Should fix** — missing required section, weak description (few trigger phrases), production-only examples, hand-waving with "see the docs"
            - 💡 **Suggestion** — additional trigger phrases that would improve activation, more troubleshooting entries, opportunity to move long content to `references/`

            Do NOT post a top-level PR comment or summary — all findings should be inline comments only.

            GUIDELINES:
            - Skip praise unless something is exceptionally well done.
            - Skip issues the validator (`scripts/check-skill.sh`) already catches — those are surfaced by CI.
            - Skip linter-level issues (markdown formatting, trailing whitespace).
            - DO flag rule violations — these are project-specific conventions the team has decided on.
            - DO flag missing trigger phrases. Skills with weak `description:` fields don't activate when developers actually need them.
            - For docs-only PRs (changes to `README.md`, `CHANGELOG.md`, `CLAUDE.md`, etc. without skill changes), focus on accuracy and consistency only — don't apply skill-quality rules.

            IMPORTANT: Do NOT modify any code, create commits, or push changes. This is a read-only review.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
