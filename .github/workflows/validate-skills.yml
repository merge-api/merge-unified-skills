name: Validate skills

on:
  pull_request:
    paths:
      - "skills/**"
      - ".claude/skills/**"
      - "scripts/check-skill.sh"
      - "scripts/check-mirrors.sh"
      - ".github/workflows/validate-skills.yml"
  push:
    branches: [main]

jobs:
  check-skill-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run check-skill.sh
        run: bash scripts/check-skill.sh

  check-mirror-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify skills/ and .claude/skills/ are in sync
        run: bash scripts/check-mirrors.sh
